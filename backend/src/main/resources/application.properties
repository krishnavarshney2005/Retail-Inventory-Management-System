# ==========================================
# Retail Inventory Management System Backend Configuration
# ==========================================

spring.application.name=retail-inventory-management
server.port=8081
server.servlet.context-path=/api

# ------------------------------------------
# MySQL Database Connection
# ------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:retail_inventory_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------
# JPA & Hibernate Settings
# ------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway is the schema authority. Existing installations are baselined at V1
# and receive subsequent, non-destructive compatibility migrations.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true

# ------------------------------------------
# Jackson / JSON Serialization
# ------------------------------------------
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ------------------------------------------
# Swagger / OpenAPI Documentation
# ------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ------------------------------------------
# CORS Allowed Origins
# ------------------------------------------
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
